syntax = "proto3";

package password_manager;

message PasswordEntryProto {
  bytes id = 1;
  string title = 2;
  string login = 3;
  bytes password = 4;
  bytes nonce = 5;
  string notes = 6;
}

message EncryptedEntries {
  repeated PasswordEntryProto entries = 1;
}

message VaultProto {
  bytes nonce = 1;
  bytes master_salt = 2;
  bytes meta_salt = 3;
  bytes entries = 4;
}
